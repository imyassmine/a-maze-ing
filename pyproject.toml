[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Dependency-free, reusable maze generator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

[tool.setuptools]
py-modules = ["mazegen"]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
]
